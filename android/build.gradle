group 'com.axevpn.flutter.openvpn'
version '2.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        // ✅ UPGRADED: Latest Android Gradle Plugin with 16 KB support
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}


apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // CRITICAL: Must match package expected by precompiled openvpn_classes.jar
    namespace = 'de.blinkt.openvpn'

    // ✅ UPGRADED: Latest Android SDK with 16 KB support
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    // ✅ CRITICAL: Enable 16KB page size support for Android 15+
    experimentalProperties["android.experimental.enable16KPageSize"] = true

    // ✅ CRITICAL: CMake configuration for 16 KB support
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36

        // ✅ CRITICAL: Version info for 16 KB compliance
        versionCode 2
        versionName "2.0.0"

        // ✅ CRITICAL: Support all architectures with 16 KB page size
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        // ✅ CRITICAL: NDK build flags for 16 KB page size support
        externalNativeBuild {
            cmake {
                cppFlags += ["-Wl,-z,max-page-size=16384"]
                arguments "-DANDROID_MAX_PAGE_SIZE=16384"
            }
        }

        consumerProguardFiles 'consumer-rules.pro'
    }

    // ✅ CRITICAL: Ensure our jniLibs/ are prioritized over nizwar's AAR libraries
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // ✅ CRITICAL: Packaging options for JNI libraries
    packaging {
        jniLibs {
            useLegacyPackaging = false
            // Keep ALL .so files from jniLibs directory
            keepDebugSymbols += ['**/*.so']
            // ✅ When the WireGuard tunnel AAR and our locally-built jniLibs both
            //    supply the same .so file, keep the first copy Gradle encounters.
            //    Local jniLibs (src/main/jniLibs) are processed first, so our
            //    16 KB-aligned versions win over the non-16 KB AAR versions.
            pickFirsts += [
                '**/libwg-go.so',
                '**/libwg.so',
                '**/libwg-quick.so',
                '**/libtun2socks.so'
            ]
        }

        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }

    // ✅ CRITICAL: Lint configuration
    lint {
        disable += ['InvalidPackage', 'ObsoleteLintCustomCheck']
        checkReleaseBuilds = false
        abortOnError = false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ✅ Renamed AAR with shorter filename to help with Windows path limit
    // ✅ OpenVPN library classes (extracted from AAR to avoid Windows path length issues)
    // AIDL, native libs, resources, and assets are now in src/main/
    implementation(files('libs/openvpn_classes.jar'))

    // ✅ Add missing dependency
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // ✅ UPGRADED: Latest Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    // ✅ Modern AndroidX libraries
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ─── WireGuard ────────────────────────────────────────────────────────────
    // The WireGuard tunnel AAR provides the Java/Kotlin API (GoBackend, Config, etc.).
    //
    // The prebuilt .so files inside this AAR were built with Go 1.21 and do NOT
    // pass Google Play's 16 KB page-alignment check for Android 15+.
    //
    // ✅ We override them with locally-built 16 KB-aligned versions placed in
    //    src/main/jniLibs/{abi}/ (see build_wireguard_16kb.ps1 and build_wg_c_libs.ps1).
    //    The packaging.jniLibs.pickFirsts rules in the android {} block above ensure
    //    our local copies win when Gradle merges JNI libs from AAR + jniLibs.
    //
    // To rebuild the local .so files (one-time setup, Windows):
    //   1. Install Go 1.23+ from https://go.dev/dl/
    //   2. Ensure Android NDK 27+ is installed via SDK Manager
    //   3. .\build_wireguard_16kb.ps1   (builds libwg-go.so)
    //   4. .\build_wg_c_libs.ps1        (builds libwg.so and libwg-quick.so)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // ─── V2Ray / Xray core ────────────────────────────────────────────────────
    // Go-mobile binding that wraps the Xray-core. The .aar is placed in
    // android/libs/ and libtun2socks.so in the per-ABI jniLibs/ directories.
    //
    // Verified (the hard way): switching this to implementation/api breaks the
    // build outright — AGP's :axevpn_flutter:bundleReleaseAar task fails with
    // "Direct local .aar file dependencies are not supported when building an
    // AAR", because AGP always builds this library module's own .aar output
    // variant, even when it's only ever consumed as a source subproject inside
    // a Flutter app build. So this module itself must stay compileOnly.
    compileOnly(files("libs/libv2ray.aar"))
}

// ─── Auto-attach libv2ray.aar to the consuming app, without buyer edits ──────
// compileOnly above means libv2ray's classes (e.g. libv2ray.V2RayVPNServiceSupportsSet)
// are NOT on the runtime classpath of any app that depends on this plugin, unless
// that app's own build.gradle separately declares the same dependency. Most
// white-label buyers never do that, which produced NoClassDefFoundError crashes on
// VLESS/VMess/V2Ray connect. Rather than require every buyer to hand-edit their
// app/build.gradle, inject the dependency into every Android application module in
// the build (normally just ":app") automatically, once all subprojects are configured.
def v2rayAarFile = file("libs/libv2ray.aar")
gradle.projectsEvaluated {
    rootProject.subprojects.each { proj ->
        if (proj.plugins.hasPlugin('com.android.application')) {
            proj.dependencies.add('implementation', proj.files(v2rayAarFile))
            logger.lifecycle("axevpn_flutter: attached libv2ray.aar to ${proj.path} automatically")
        }
    }
}
