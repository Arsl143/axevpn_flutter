name: axevpn_flutter
description: Multi-protocol VPN plugin for Flutter supporting OpenVPN, WireGuard, V2Ray/Xray (VLESS, VMess, Trojan, Shadowsocks) and OpenConnect on Android and iOS.
version: 3.0.1
homepage: https://github.com/arsl143/axevpn_flutter
repository: https://github.com/arsl143/axevpn_flutter
issue_tracker: https://github.com/arsl143/axevpn_flutter/issues
documentation: https://github.com/arsl143/axevpn_flutter#readme

topics:
  - vpn
  - openvpn
  - wireguard
  - v2ray
  - openconnect
  - networking
  - security

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.axevpn.flutter.openvpn
        pluginClass: AxeVPNFlutterPlugin
      ios:
        pluginClass: SwiftAxeVPNFlutterPlugin
